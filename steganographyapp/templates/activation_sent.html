{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Check Your Email | Steganography Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
 <style>
    :root {
        --primary-blue: #1469e8;
        --primary-dark: #0b2d63;
        --light-blue: #eaf3ff;
        --soft-blue: #f7faff;
        --border-blue: #d7e6f8;
        --text-dark: #0b2348;
        --text-muted: #64748b;
        --white: #ffffff;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(
            180deg,
            #ffffff 0%,
            #f5f9ff 100%
        );
        color: var(--text-dark);
        font-family: 'Roboto', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 18px;
    }

    .verify-card {
        width: 100%;
        max-width: 560px;
        background: #ffffff;
        border: 1px solid var(--border-blue);
        border-radius: 22px;
        padding: 48px 42px;
        text-align: center;
        box-shadow: 0 18px 45px rgba(14, 60, 115, 0.09);
        position: relative;
        overflow: hidden;
    }

    .verify-card::before {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: rgba(20, 105, 232, 0.045);
        top: -95px;
        right: -75px;
    }

    .icon-circle {
        width: 78px;
        height: 78px;
        border-radius: 18px;
        margin: 0 auto 24px;
        background: var(--light-blue);
        border: 1px solid #d5e7fb;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary-blue);
        font-size: 31px;
        position: relative;
        z-index: 1;
    }

    h1 {
        color: var(--text-dark);
        font-size: 2.1rem;
        font-weight: 800;
        margin-bottom: 15px;
        letter-spacing: -0.5px;
        position: relative;
        z-index: 1;
    }

    p {
        color: var(--text-muted);
        line-height: 1.75;
        font-size: 0.96rem;
        position: relative;
        z-index: 1;
    }

    .btn-main {
        background: linear-gradient(
            135deg,
            var(--primary-blue),
            #0d5dd7
        );
        border: none;
        color: #ffffff;
        padding: 12px 26px;
        border-radius: 10px;
        font-weight: 700;
        text-decoration: none;
        display: inline-block;
        margin-top: 18px;
        transition: 0.3s ease;
        box-shadow: 0 8px 20px rgba(20, 105, 232, 0.20);
        position: relative;
        z-index: 1;
    }

    .btn-main:hover {
        color: #ffffff;
        transform: translateY(-2px);
        box-shadow: 0 12px 26px rgba(20, 105, 232, 0.27);
    }

    @media (max-width: 576px) {
        .verify-card {
            padding: 38px 24px;
            border-radius: 18px;
        }

        .icon-circle {
            width: 68px;
            height: 68px;
            font-size: 27px;
        }

        h1 {
            font-size: 1.8rem;
        }

        p {
            font-size: 0.92rem;
        }
    }
</style>
</head>
<body>

<div class="verify-card">
    <div class="icon-circle">
        <i class="fa-solid fa-envelope-circle-check"></i>
    </div>

    <h1>Check Your Email</h1>

    <p>
        We have sent an activation link to your email address.
        Please open your inbox and click the confirmation link to activate your account.
    </p>

    <p>
        After activation, you will be redirected back to the website.
    </p>

    <a href="{% url 'home' %}" class="btn-main">
        Back to Home
    </a>
</div>

</body>
</html>
